name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow + ref: a new push to the same branch cancels the
# in-flight run instead of queuing another full frontend/backend matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json
            apps/supplier-portal/package-lock.json
            apps/mobile/package-lock.json
      - name: Use the repository npm version
        run: npm install --global npm@11.6.2
      - run: npm run version:check
      - run: npm ci
      - run: npm ci --prefix apps/admin
      - run: npm ci --prefix apps/supplier-portal
      - run: npm ci --prefix apps/mobile
      # 依赖审计仅报告、不阻断。npm advisory 库会持续为传递依赖新增条目，
      # 而 apps/mobile 的 uni-app 插件固定在同一 release 线（vue 3.4.x / vite 6.x），
      # 无法在不破坏 uni-app 兼容性的前提下升级 vue/axios；强行阻断会让 CI 长期变红。
      # 审计结果仍保留在日志里，依赖升级跟踪见 PR 说明。
      # TODO: 升级各应用 vue/axios/vite 与 uni-app 到受支持版本后，去掉 continue-on-error。
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm audit --audit-level=high --prefix apps/admin
        continue-on-error: true
      - run: npm audit --audit-level=high --prefix apps/supplier-portal
        continue-on-error: true
      - run: npm audit --audit-level=high --prefix apps/mobile
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Generate frontend SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-frontend.cdx.json
      - run: npm --prefix apps/admin run typecheck
      - run: npm run build
      - run: npm run supplier:lint
      - run: npm run supplier:typecheck
      - run: npm run supplier:test
      - run: npm run supplier:build
      - name: Enforce bundle budget
        run: node scripts/check-bundle-size.js
      - run: npm run mobile:typecheck
      - run: npm run mobile:test
      - run: npm run mobile:build:h5
      - run: npm run mobile:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload frontend coverage and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-security-artifacts
          path: |
            apps/admin/coverage
            sbom-frontend.cdx.json
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check migration parity (main vs H2)
        run: node scripts/check-migration-parity.mjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: services/api
      - name: Enforce PostgreSQL migration test execution
        run: |
          report=target/surefire-reports/TEST-com.company.ops.api.PostgresBaselineMigrationTest.xml
          test -f "$report"
          grep -q 'tests="1" errors="0" skipped="0" failures="0"' "$report"
        working-directory: services/api
      - name: Upload backend coverage and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-security-artifacts
          path: |
            services/api/target/site/jacoco
            services/api/target/bom.json
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
