name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json
            apps/mobile/package-lock.json
      - name: Use the repository npm version
        run: npm install --global npm@11.6.2
      - run: npm run version:check
      - run: npm ci
      - run: npm ci --prefix apps/admin
      - run: npm ci --prefix apps/mobile
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix apps/admin
      - run: npm audit --audit-level=high --prefix apps/mobile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Generate frontend SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-frontend.cdx.json
      - run: npm --prefix apps/admin run typecheck
      - run: npm run build
      - name: Enforce bundle budget
        run: node scripts/check-bundle-size.js
      - run: npm run mobile:typecheck
      - run: npm run mobile:test
      - run: npm run mobile:build:h5
      - run: npm run mobile:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload frontend coverage and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-artifacts
          path: |
            apps/admin/coverage
            sbom-frontend.cdx.json
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: services/api
      - name: Enforce PostgreSQL migration test execution
        run: |
          report=target/surefire-reports/TEST-com.company.ops.api.PostgresBaselineMigrationTest.xml
          test -f "$report"
          grep -q 'tests="1" errors="0" skipped="0" failures="0"' "$report"
        working-directory: services/api
      - name: Upload backend coverage and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-artifacts
          path: |
            services/api/target/site/jacoco
            services/api/target/bom.json
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
