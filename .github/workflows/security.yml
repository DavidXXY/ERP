name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Java sources
        if: matrix.language == 'java-kotlin'
        working-directory: services/api
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Config scan is blocking on CRITICAL/HIGH. Dependency (SBOM) and image scans
  # are report-only until the pending dependency/base-image upgrades land; their
  # findings still appear in the Security tab.
  #
  # TODO: re-enable the SBOM gate (exit-code: "1" plus
  # limit-severities-for-sarif: "true") once Spring Boot is upgraded; 3.4.1 is
  # from Dec 2024 and currently reports 15 CRITICAL / 51 HIGH (Tomcat, Spring
  # Security, Spring Framework, Netty, BouncyCastle).
  sca-backend:
    name: Java dependency scan (Trivy SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Generate CycloneDX SBOM
        working-directory: services/api
        run: mvn --batch-mode --no-transfer-progress -DskipTests cyclonedx:makeAggregateBom
      - name: Run Trivy SBOM scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          # `sbom:` is not an input of trivy-action; the SBOM path goes in
          # scan-ref, which the action passes as the `trivy sbom` argument.
          scan-ref: services/api/target/bom.json
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          # Report-only for now: the current dependency set has unfixed
          # CRITICALs that require a Spring Boot upgrade, not a workflow change.
          exit-code: "0"
      - name: Upload Trivy SBOM results to the Security tab
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  trivy-image:
    name: Trivy image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Images referenced by deploy/docker-compose.yml
        include:
          - name: postgres
            image: postgres:16-alpine
          - name: redis
            image: redis:7-alpine
        # minio/minio was removed from Docker Hub (quay.io/minio/minio now
        # requires authentication), so the image cannot be pulled. Re-add the
        # matrix entry together with a supported S3-compatible image. See the
        # note in deploy/docker-compose.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # Report-only: findings still land in the Security tab.
          exit-code: "0"
      - name: Upload Trivy image results to the Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.name }}

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy on deploy/docker-compose.yml
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/docker-compose.yml
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          exit-code: "1"
      - name: Upload Trivy config results to the Security tab
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
