server {
    listen 87;
    listen [::]:87;
    server_name 10.10.10.111;

    root /var/www/ops-erp-mobile/current;
    include /etc/nginx/snippets/ops-erp-common.conf;
}

server {
    listen 88;
    listen [::]:88;
    server_name 10.10.10.111;

    root /var/www/ops-erp-admin/current;
    include /etc/nginx/snippets/ops-erp-common.conf;

    # Original qualification files are never public frontend assets.
    location ^~ /qualification-assets/ {
        return 404;
    }
}

server {
    listen 89;
    listen [::]:89;
    server_name 10.10.10.111;

    root /var/www/ops-erp-supplier-portal/current;
    include /etc/nginx/snippets/ops-erp-common.conf;
}
