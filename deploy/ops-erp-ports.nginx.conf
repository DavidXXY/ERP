# 内网多端口入口：87/90 = 移动端 H5，88 = 管理后台，89 = 供应商门户。
# 限流 zone（ops_erp_api / ops_erp_auth）在 /etc/nginx/conf.d/ops-erp-http.conf 中定义，
# 安全响应头、真实 IP 与 /api 反向代理由 ops-erp-common.conf 提供。
#
# 这些端口为内网明文 HTTP。若需公网暴露，请为其增加 TLS 终止，例如：
#   server {
#       listen 8443 ssl http2;
#       server_name erp.example.com;
#       ssl_certificate     /etc/nginx/tls/fullchain.pem;
#       ssl_certificate_key /etc/nginx/tls/privkey.pem;
#       ssl_protocols TLSv1.2 TLSv1.3;
#       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#       root /var/www/ops-erp-admin/current;
#       include /etc/nginx/snippets/ops-erp-common.conf;
#   }

server {
    listen 87;
    listen [::]:87;
    listen 90;
    listen [::]:90;
    server_name 10.10.10.111;

    root /var/www/ops-erp-mobile/current;
    include /etc/nginx/snippets/ops-erp-common.conf;
}

server {
    listen 88;
    listen [::]:88;
    server_name 10.10.10.111;

    root /var/www/ops-erp-admin/current;
    include /etc/nginx/snippets/ops-erp-common.conf;

    # Original qualification files are never public frontend assets.
    location ^~ /qualification-assets/ {
        return 404;
    }
}

server {
    listen 89;
    listen [::]:89;
    server_name 10.10.10.111;

    root /var/www/ops-erp-supplier-portal/current;
    include /etc/nginx/snippets/ops-erp-common.conf;
}
