server {
    listen 80;
    listen [::]:80;
    server_name 10.10.10.111;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 10.10.10.111;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/ops-erp-admin/current;
    index index.html;
    client_max_body_size 80m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 真实客户端 IP：与后端 TRUSTED_PROXY_CIDRS 保持一致
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        limit_req zone=ops_erp_api burst=20 nodelay;
        include /etc/nginx/snippets/ops-erp-proxy.conf;
    }

    # 登录/找回密码/重置等认证接口使用更严格的限流，缓解暴力破解
    location ~ ^/api/(auth/login|supplier-portal/auth/(login|forgot-password|reset-password))$ {
        limit_req zone=ops_erp_auth burst=5 nodelay;
        include /etc/nginx/snippets/ops-erp-proxy.conf;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /actuator/prometheus {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Legacy qualification originals must never be served as public frontend assets.
    location ^~ /qualification-assets/ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
