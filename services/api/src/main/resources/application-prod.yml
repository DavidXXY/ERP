# ═══════════════════════════════════════════
# 生产环境配置（通过 --spring.profiles.active=prod 激活）
# 所有敏感值通过 ops-erp.env 环境变量文件注入
# ═══════════════════════════════════════════

spring:
  # 数据源 — 生产用 PostgreSQL（由 docker-compose 或外部提供）
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA — 生产环境关闭 SQL 日志
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Redis — 生产环境开启（会话缓存、数据缓存）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # 文件上传大小
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # Flyway — 校验迁移脚本完整性
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

# 服务端端口（Nginx 反向代理用）
server:
  address: 127.0.0.1
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html
    min-response-size: 1024

# Actuator — 仅绑定回环地址，由 Nginx 控制健康检查与指标访问
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ops-erp-api
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Swagger — 生产环境建议关闭，或加权限控制
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui

# 业务配置
ops:
  backup:
    status-directory: ${OPS_STATUS_DIR:/var/backups/ops-erp/.status}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:30}
    allowed-origins: ${ALLOWED_ORIGINS}
    data-encryption-key: ${DATA_ENCRYPTION_KEY}
    data-encryption-key-id: ${DATA_ENCRYPTION_KEY_ID:primary}
    data-encryption-previous-keys: ${DATA_ENCRYPTION_PREVIOUS_KEYS:}
  storage:
    type: ${STORAGE_TYPE:minio}
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:ops-erp}
  qualification:
    import: ${QUALIFICATION_IMPORT_ENABLED:false}
    import-file: ${QUALIFICATION_IMPORT_FILE:}
  wechat:
    enabled: ${WECHAT_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  supplier-portal:
    # 生产环境禁止把密码重置验证码直接回传给调用方
    dev-password-reset-code: false
